name: M3 native routing safety

on:
  pull_request:
    paths:
      - 'zynthian/zynthian_engine_mbh_router.py'
      - 'tests/test_zynthian_channel_source.py'
      - 'tests/test_zynthian_feedback_guard.py'
      - 'tests/test_zynthian_exclusive_input.py'
      - '.github/workflows/m3-routing-tests.yml'
      - 'scripts/zynthian-m3-safe-smoke.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python sources compile
        run: |
          python -m py_compile zynthian/zynthian_engine_mbh_router.py scripts/zynthian-m3-safe-smoke.py
          python -m py_compile tests/test_zynthian_channel_source.py tests/test_zynthian_feedback_guard.py tests/test_zynthian_exclusive_input.py
      - name: Execute focused routing regression tests
        run: |
          python tests/test_zynthian_channel_source.py -v
          python tests/test_zynthian_feedback_guard.py -v
          python tests/test_zynthian_exclusive_input.py -v
