
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBMF | Design Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --yellow: #ffe500;
  --line: #666;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0a0a0a;
  color: #ddd;
  font-family: "IBM Plex Mono", "Courier New", monospace;
}
main { max-width: 1100px; margin: 45px auto; padding: 16px; }
header {
  display: grid;
  grid-template-columns: 58% 42%;
  min-height: 165px;
  background: #101010;
}
.art {
  position: relative;
  min-height: 165px;
  background: #080808;
  overflow: hidden;
  display: flex;
  align-items: center;
}
.art img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  object-position: center;
}
.panel {
  background-color: #101010;
  background-image: url("./design/assets/images/header_bck_dirt.png");
  background-position: right center;
  background-repeat: no-repeat;
  background-size: cover;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  letter-spacing: .025em;
}
.label { color: #888; }
.status { color: var(--yellow); font-weight: bold; }
.status::before { content: "● "; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
button, input {
  background: #0c0c0c;
  border: 1px solid #888;
  color: #eee;
  font: inherit;
  padding: 8px 10px;
}
button {
  cursor: pointer;
  font-family: "Barlow Condensed", Impact, "Arial Narrow", sans-serif;
  font-weight: 500;
  font-size: 20px;
  letter-spacing: .045em;
  text-transform: uppercase;
}
button:hover { background: #292929; }
#panic { color: var(--yellow); border-color: var(--yellow); }
input { width: 145px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
.header-separator { display: block; width: 100%; height: auto; margin: -12px 0 0; padding: 0; border: 0; position: relative; z-index: 2; }
footer { color: #888; font-size: 11px; margin-top: 12px; }
@media(max-width:650px) {
  header { grid-template-columns: 1fr; }
  .panel { border: 0; }
  .panel { border: 0; }
}
</style>
</head>
<body>
<main>
  <header>
    <div class="art">
      <img src="./design/assets/images/header_mbmf.png" alt="MIDI BAD MOTHERFUCKER" width="580" height="160">
    </div>
    <div class="panel">
      <div class="row">
        <span class="label">ENGINE</span>
        <span class="status">RUNNING · DEMO</span>
      </div>
      <div class="row">
        <span class="label">NATIVE</span>
        <span>STOPPED</span>
      </div>
      <div class="row">
        <span class="label">ACTIVE NOTES</span>
        <span>00</span>
      </div>
      <div class="row">
        <label class="label" for="token">LAN TOKEN</label>
        <input id="token" type="password" value="preview" readonly>
      </div>
      <div class="controls">
        <button id="connect" disabled>CONNECT</button>
        <button id="panic" disabled>PANIC</button>
      </div>
    </div>
  </header>
  <img class="header-separator" src="./design/assets/images/hori_separator_01.png" alt="" aria-hidden="true">
  <footer>MBMF DESIGN LAB · STATIC PREVIEW · NO MIDI ENGINE</footer>
</main>
</body>
</html>
