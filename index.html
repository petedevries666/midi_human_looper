
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBMF | Design Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --yellow: #ffe500;
  --line: #666;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0a0a0a;
  color: #ddd;
  font-family: "IBM Plex Mono", "Courier New", monospace;
}
main { max-width: 1100px; margin: 45px auto; padding: 16px; }
header {
  display: grid;
  grid-template-columns: 58% 42%;
  min-height: 0;
  background: #101010;
}
.art {
  position: relative;
  min-height: 0;
  background: #080808;
  overflow: hidden;
  display: flex;
  align-items: center;
}
.art img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  object-position: center;
}
.panel {
  background-color: #101010;
  background-image: url("./design/assets/images/header_bck_dirt.png");
  background-position: right center;
  background-repeat: no-repeat;
  background-size: cover;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  letter-spacing: .025em;
}
.label { color: #888; }
.status { color: var(--yellow); font-weight: bold; }
.status::before { content: "● "; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
button, input {
  background: #0c0c0c;
  border: 1px solid #888;
  color: #eee;
  font: inherit;
  padding: 8px 10px;
}
button {
  cursor: pointer;
  font-family: "Barlow Condensed", Impact, "Arial Narrow", sans-serif;
  font-weight: 500;
  font-size: 20px;
  letter-spacing: .045em;
  text-transform: uppercase;
}
button:hover { background: #292929; }
#panic { color: var(--yellow); border-color: var(--yellow); }
input { width: 145px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
.header-separator { display: block; width: 100%; height: auto; margin: -12px 0 0; padding: 0; border: 0; position: relative; z-index: 2; }

/* PATCH toolbar: native headless action IDs, static preview only. */
.patch-toolbar {
  display:flex; align-items:center; flex-wrap:wrap; gap:8px;
  padding:12px 12px 10px; background:#0b0b0b;
  border-bottom:1px solid #252525; color:#e8e8e8;
}
.patch-toolbar .patch-label { font-family:"Barlow Condensed",Impact,sans-serif; font-weight:500; font-size:15px; line-height:normal; letter-spacing:.025em; margin-right:4px; }
.patch-toolbar button, .patch-toolbar select {
  border:1px solid #646464; border-radius:0; background:#0b0b0b;
  color:#ddd; font:500 15px "Barlow Condensed",Impact,sans-serif;
  padding:5px 11px; min-height:31px; letter-spacing:.025em;
}
.patch-toolbar button { font-size:15px; }
.patch-toolbar .patch-label { font-size:15px; }
.patch-toolbar button:disabled { opacity:.8; cursor:not-allowed; }
.patch-toolbar .patch-nav { display:flex; align-items:stretch; }
.patch-toolbar .patch-nav > * + * { border-left:0; }
.patch-toolbar #patch-slot { width:43px; padding:5px 3px; text-align:center; appearance:none; }
.patch-toolbar .patch-spacer { flex:1; }
.patch-toolbar .patch-extra { display:flex; gap:8px; }
.patch-toolbar .patch-preview-note { flex-basis:100%; font-size:10px; color:#777; letter-spacing:.02em; }
@media(max-width:650px) { .patch-toolbar { gap:6px; } .patch-toolbar .patch-extra { flex-wrap:wrap; } }
footer { color: #888; font-size: 11px; margin-top: 12px; }
@media(max-width:650px) {
  header { grid-template-columns: 1fr; }
  .panel { border: 0; }
}
</style>
</head>
<body>
<main>
  <header>
    <div class="art">
      <img src="./design/assets/images/header_mbmf.png" alt="MIDI BAD MOTHERFUCKER" width="580" height="160">
    </div>
    <div class="panel">
      <div class="row">
        <span class="label">ENGINE</span>
        <span class="status">RUNNING · DEMO</span>
      </div>
      <div class="row">
        <span class="label">NATIVE</span>
        <span>STOPPED</span>
      </div>
      <div class="row">
        <span class="label">ACTIVE NOTES</span>
        <span>00</span>
      </div>
      <div class="row">
        <label class="label" for="token">LAN TOKEN</label>
        <input id="token" type="password" value="preview" readonly>
      </div>
      <div class="controls">
        <button id="connect" disabled>CONNECT</button>
        <button id="panic" disabled>PANIC</button>
      </div>
    </div>
  </header>
  <img class="header-separator" src="./design/assets/images/hori_separator_01.png" alt="" aria-hidden="true">

  <nav class="patch-toolbar" aria-label="Patch controls">
    <span class="patch-label">PATCH</span>
    <div class="patch-nav">
      <button id="patch-prev" type="button" aria-label="Previous patch">‹</button>
      <select id="patch-slot" aria-label="Patch slot"><option value="1">1</option><option value="2">2</option></select>
      <button id="patch-next" type="button" aria-label="Next patch">›</button>
    </div>
    <button id="save-patch" type="button" disabled title="Native: POST /api/v1/patch/save">▣</button>
    <button id="load-patch" type="button" disabled title="Native: POST /api/v1/patch/load">⇩</button>
    <button type="button" disabled title="No corresponding headless command verified">↻</button>
    <button type="button" disabled title="No corresponding headless command verified">CLEAR</button>
    <button id="export-patch" type="button" disabled title="Native: POST /api/v1/patch/export">JSFX BASE</button>
    <span class="patch-spacer"></span>
    <div class="patch-extra">
      <button type="button" disabled title="No separate SAVE action in the current headless UI">▱ SAVE</button>
      <button type="button" disabled title="No PROJECT handler in the current headless UI">PROJECT</button>
    </div>
    <span id="patch-status" class="patch-preview-note" role="status">DESIGN PREVIEW · PATCH NAVIGATION ONLY · ENGINE ACTIONS AVAILABLE IN HEADLESS APP</span>
  </nav>
  <script>
    (() => {
      const slot = document.getElementById('patch-slot');
      const slots = [...slot.options].map(o => o.value);
      function shift(by) { slot.value = slots[(slots.indexOf(slot.value) + by + slots.length) % slots.length]; }
      document.getElementById('patch-prev').addEventListener('click', () => shift(-1));
      document.getElementById('patch-next').addEventListener('click', () => shift(1));
    })();
  </script>
  <footer>MBMF DESIGN LAB · STATIC PREVIEW · NO MIDI ENGINE</footer>
</main>
</body>
</html>
