name: M5 POSIX patch recall lock

on:
  pull_request:
    paths:
      - 'headless/patch_lock.py'
      - 'headless/patch_recall.py'
      - 'tests/test_patch_lock.py'
      - 'tests/test_patch_recall.py'
      - '.github/workflows/m5-recall-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posix-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile recall implementation and regressions
        run: python -m py_compile headless/patch_lock.py headless/patch_recall.py tests/test_patch_lock.py tests/test_patch_recall.py
      - name: Test process-level lock ownership and waiting
        run: python tests/test_patch_lock.py -v
      - name: Test recall orchestration and phase reporting
        run: python tests/test_patch_recall.py -v